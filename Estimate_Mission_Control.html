<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Schedule, readiness, and review tracking for cost products.">
  <meta name="application-name" content="Estimate Mission Control">
  <meta name="theme-color" content="#071420">
    <title>Estimate Mission Control V1.2</title>
  <style>
:root {
  --navy-950: #071420;
  --navy-900: #0a1c2d;
  --navy-850: #0d2538;
  --navy-800: #123149;
  --navy-700: #1b405b;
  --cyan-500: #14b8d4;
  --cyan-400: #35cbe3;
  --cyan-200: #b5edf5;
  --ice-50: #f6fafc;
  --ice-100: #edf5f8;
  --ice-200: #dce9ee;
  --slate-300: #becdd4;
  --slate-500: #6e838e;
  --slate-700: #344b56;
  --ink: #132933;
  --green: #14815d;
  --green-bg: #e9f7f1;
  --yellow: #a76605;
  --yellow-bg: #fff5dd;
  --red: #c43d45;
  --red-bg: #fff0f1;
  --white: #ffffff;
  --sidebar: 224px;
  --banner: 34px;
  --topbar: 80px;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgb(7 20 32 / 0.08);
  --shadow: 0 12px 32px rgb(7 20 32 / 0.09);
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--ice-50);
  color: var(--ink);
  min-width: 320px;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 72% -10%, rgb(20 184 212 / 0.08), transparent 34rem),
    var(--ice-50);
  color: var(--ink);
  min-height: 100vh;
}

button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
}

button,
select {
  cursor: pointer;
}

button:disabled,
select:disabled,
input:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

button {
  border: 0;
}

input,
select,
textarea {
  background: var(--white);
  border: 1px solid var(--slate-300);
  border-radius: var(--radius-sm);
  min-height: 38px;
  padding: 7px 10px;
  width: 100%;
}

input:focus,
select:focus,
textarea:focus,
button:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid rgb(20 184 212 / 0.28);
  outline-offset: 2px;
}

textarea {
  resize: vertical;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

.sr-only {
  clip: rect(0, 0, 0, 0);
  clip-path: inset(50%);
  height: 1px;
  overflow: hidden;
  position: absolute;
  white-space: nowrap;
  width: 1px;
}

.skip-link {
  background: var(--white);
  border-radius: var(--radius-sm);
  color: var(--navy-900);
  left: 12px;
  padding: 10px 14px;
  position: fixed;
  top: -80px;
  z-index: 999;
}

.skip-link:focus {
  top: 8px;
}

.icon {
  flex: 0 0 auto;
  height: 20px;
  width: 20px;
}

.app-shell {
  display: grid;
  grid-template:
    "banner banner" var(--banner)
    "sidebar topbar" var(--topbar)
    "sidebar main" 1fr / var(--sidebar) minmax(0, 1fr);
  min-height: 100vh;
}

.handling-banner {
  align-items: center;
  background: var(--navy-950);
  color: var(--white);
  display: flex;
  font-size: 11px;
  gap: 7px;
  grid-area: banner;
  justify-content: center;
  letter-spacing: 0.08em;
  min-height: var(--banner);
  padding: 5px 20px;
  text-align: center;
}

.handling-banner .icon {
  color: var(--cyan-400);
  height: 16px;
  width: 16px;
}

.handling-banner span {
  color: var(--cyan-200);
}

.topbar {
  align-items: center;
  background: rgb(255 255 255 / 0.94);
  border-bottom: 1px solid var(--ice-200);
  display: grid;
  gap: 20px;
  grid-area: topbar;
  grid-template-columns: auto minmax(320px, 1fr) auto;
  padding: 0 24px;
  position: sticky;
  top: var(--banner);
  z-index: 50;
}

.brand {
  align-items: center;
  background: transparent;
  color: var(--navy-900);
  display: none;
  gap: 10px;
  padding: 0;
  text-align: left;
}

.brand > span:last-child {
  font-size: 16px;
  font-weight: 650;
  line-height: 1.05;
}

.brand strong {
  color: var(--cyan-500);
}

.brand small {
  color: var(--slate-500);
  display: block;
  font-size: 8px;
  letter-spacing: 0.11em;
  margin-top: 4px;
  text-transform: uppercase;
}

.brand-mark {
  align-items: end;
  background: var(--navy-900);
  border-radius: 10px;
  display: flex;
  gap: 2px;
  height: 34px;
  justify-content: center;
  overflow: hidden;
  padding: 7px;
  transform: rotate(-3deg);
  width: 34px;
}

.brand-mark i {
  background: var(--cyan-400);
  border-radius: 2px 2px 0 0;
  display: block;
  height: 16px;
  width: 4px;
}

.brand-mark i:nth-child(2) {
  height: 11px;
}

.brand-mark i:nth-child(3) {
  height: 21px;
}

.topbar-context {
  align-items: center;
  display: flex;
  gap: 20px;
  min-width: 0;
}

.estimate-switcher {
  flex: 0 1 300px;
}

.estimate-switcher select {
  background: var(--ice-50);
  border-color: var(--ice-200);
  font-weight: 650;
}

.gate-brief {
  border-left: 1px solid var(--ice-200);
  display: grid;
  gap: 1px;
  padding-left: 20px;
}

.gate-brief span {
  color: var(--slate-500);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.gate-brief strong {
  color: var(--navy-900);
  font-size: 13px;
}

.gate-brief small {
  color: var(--slate-500);
  font-size: 11px;
}

.topbar-actions {
  align-items: center;
  display: flex;
  gap: 4px;
}

.icon-button {
  align-items: center;
  background: transparent;
  border-radius: 9px;
  color: var(--slate-700);
  display: inline-flex;
  height: 38px;
  justify-content: center;
  width: 38px;
}

.icon-button:hover {
  background: var(--ice-100);
  color: var(--navy-900);
}

.save-state {
  align-items: center;
  color: var(--slate-500);
  display: inline-flex;
  font-size: 11px;
  gap: 6px;
  margin-right: 6px;
  white-space: nowrap;
}

.save-state i {
  background: var(--green);
  border: 2px solid var(--green-bg);
  border-radius: 50%;
  display: block;
  height: 9px;
  width: 9px;
}

.save-state.is-saving i {
  animation: pulse 1s infinite;
  background: var(--yellow);
}

@keyframes pulse {
  50% { opacity: 0.35; }
}

.sidebar {
  background:
    linear-gradient(180deg, rgb(20 184 212 / 0.06), transparent 35%),
    var(--navy-900);
  color: var(--white);
  display: flex;
  flex-direction: column;
  grid-area: sidebar;
  justify-content: space-between;
  padding: 18px 12px;
  position: sticky;
  top: var(--banner);
  height: calc(100vh - var(--banner));
}

.sidebar::before {
  color: var(--cyan-200);
  content: "ESTIMATE MISSION CONTROL";
  display: block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  margin: 3px 12px 24px;
}

.sidebar nav {
  display: grid;
  gap: 4px;
}

.sidebar nav button {
  align-items: center;
  background: transparent;
  border-radius: 10px;
  color: #aac0ca;
  display: flex;
  font-size: 13px;
  font-weight: 580;
  gap: 12px;
  padding: 11px 12px;
  text-align: left;
}

.sidebar nav button:hover {
  background: rgb(255 255 255 / 0.06);
  color: var(--white);
}

.sidebar nav button.active {
  background: linear-gradient(90deg, rgb(20 184 212 / 0.2), rgb(20 184 212 / 0.07));
  color: var(--white);
  position: relative;
}

.sidebar nav button.active::before {
  background: var(--cyan-400);
  border-radius: 0 3px 3px 0;
  content: "";
  height: 24px;
  left: -12px;
  position: absolute;
  top: 8px;
  width: 3px;
}

.sidebar nav button.active .icon {
  color: var(--cyan-400);
}

.sidebar-foot {
  border-top: 1px solid rgb(255 255 255 / 0.1);
  color: #78919d;
  display: flex;
  font-size: 9px;
  justify-content: space-between;
  padding: 14px 9px 2px;
  text-transform: uppercase;
}

.main-content {
  grid-area: main;
  min-width: 0;
  padding: 30px clamp(20px, 3vw, 44px) 60px;
}

.page-head {
  align-items: end;
  display: flex;
  gap: 24px;
  justify-content: space-between;
  margin: 0 auto 24px;
  max-width: 1480px;
}

.page-head h1 {
  color: var(--navy-900);
  font-size: clamp(25px, 2.3vw, 34px);
  letter-spacing: -0.035em;
  margin-bottom: 7px;
}

.page-head > div:first-child > p:last-child {
  color: var(--slate-500);
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 0;
}

.eyebrow {
  color: var(--cyan-500);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  margin-bottom: 7px;
  text-transform: uppercase;
}

.page-actions,
.button-row {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.button {
  align-items: center;
  border: 1px solid transparent;
  border-radius: 10px;
  display: inline-flex;
  font-size: 12px;
  font-weight: 700;
  gap: 7px;
  justify-content: center;
  min-height: 39px;
  padding: 9px 14px;
}

.button .icon {
  height: 17px;
  width: 17px;
}

.button-primary {
  background: var(--cyan-500);
  box-shadow: 0 5px 16px rgb(20 184 212 / 0.2);
  color: var(--navy-950);
}

.button-primary:hover {
  background: var(--cyan-400);
}

.button-secondary {
  background: var(--white);
  border-color: var(--ice-200);
  color: var(--navy-900);
}

.button-secondary:hover {
  border-color: var(--cyan-500);
}

.button-danger {
  background: var(--red-bg);
  border-color: #f4c9cc;
  color: var(--red);
}

.button-small {
  background: var(--navy-900);
  color: var(--white);
  min-height: 36px;
  padding: 7px 11px;
}

.text-button {
  align-items: center;
  background: transparent;
  color: var(--cyan-500);
  display: inline-flex;
  font-size: 11px;
  font-weight: 700;
  gap: 4px;
  padding: 4px;
}

.text-button .icon {
  height: 14px;
  width: 14px;
}

.danger-text {
  color: var(--red);
}

.empty-state {
  align-items: center;
  background: var(--white);
  border: 1px solid var(--ice-200);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  margin: 36px auto;
  max-width: 700px;
  padding: 70px 30px;
  text-align: center;
}

.empty-state.compact {
  margin-top: 18px;
  padding: 40px 25px;
}

.empty-state h2 {
  color: var(--navy-900);
  font-size: 23px;
  margin: 18px 0 8px;
}

.empty-state p {
  color: var(--slate-500);
  line-height: 1.6;
  max-width: 480px;
}

.empty-orbit {
  align-items: center;
  background: var(--navy-900);
  border: 8px solid var(--ice-100);
  border-radius: 50%;
  color: var(--cyan-400);
  display: flex;
  height: 74px;
  justify-content: center;
  position: relative;
  width: 74px;
}

.empty-orbit::after {
  border: 1px solid var(--cyan-500);
  border-radius: 50%;
  content: "";
  height: 88px;
  left: -15px;
  position: absolute;
  top: -6px;
  transform: rotate(-18deg) scaleY(0.48);
  width: 88px;
}

.portfolio-summary,
.metric-strip {
  background: var(--navy-900);
  border-radius: var(--radius);
  color: var(--white);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin: 0 auto 18px;
  max-width: 1480px;
  overflow: hidden;
}

.portfolio-summary > div,
.metric-strip > div {
  border-right: 1px solid rgb(255 255 255 / 0.1);
  display: grid;
  gap: 3px;
  padding: 17px 22px;
}

.portfolio-summary > div:last-child,
.metric-strip > div:last-child {
  border-right: 0;
}

.portfolio-summary span,
.metric-strip span {
  color: #9bb2bd;
  font-size: 10px;
  text-transform: uppercase;
}

.portfolio-summary strong,
.metric-strip strong {
  color: var(--cyan-200);
  font-size: 20px;
}

.portfolio-grid {
  display: grid;
  gap: 15px;
  grid-template-columns: repeat(3, minmax(270px, 1fr));
  margin: 0 auto;
  max-width: 1480px;
}

.portfolio-card {
  background: var(--white);
  border: 1px solid var(--ice-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  min-width: 0;
  overflow: hidden;
  position: relative;
}

.portfolio-card::before {
  background: var(--green);
  content: "";
  height: 4px;
  left: 0;
  position: absolute;
  right: 0;
  top: 0;
}

.portfolio-card[data-level="yellow"]::before { background: var(--yellow); }
.portfolio-card[data-level="red"]::before { background: var(--red); }

.portfolio-card:hover {
  border-color: var(--cyan-400);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.card-open {
  background: transparent;
  display: block;
  padding: 22px;
  text-align: left;
  width: 100%;
}

.card-topline,
.status-card-head,
.issue-card-head,
.issue-foot {
  align-items: center;
  display: flex;
  justify-content: space-between;
}

.product-chip {
  background: var(--ice-100);
  border-radius: 999px;
  color: var(--navy-700);
  display: inline-flex;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
  padding: 5px 8px;
  text-transform: uppercase;
}

.stoplight-pill {
  align-items: center;
  border-radius: 999px;
  display: inline-flex;
  font-size: 9px;
  font-weight: 800;
  gap: 5px;
  padding: 5px 8px;
  text-transform: uppercase;
}

.stoplight-pill i,
.status-signal i {
  background: currentColor;
  border-radius: 50%;
  display: block;
  height: 7px;
  width: 7px;
}

.level-green.stoplight-pill,
.stoplight-pill.level-green {
  background: var(--green-bg);
  color: var(--green);
}

.level-yellow.stoplight-pill,
.stoplight-pill.level-yellow {
  background: var(--yellow-bg);
  color: var(--yellow);
}

.level-red.stoplight-pill,
.stoplight-pill.level-red {
  background: var(--red-bg);
  color: var(--red);
}

.portfolio-card h2 {
  color: var(--navy-900);
  font-size: 19px;
  margin: 18px 0 4px;
}

.portfolio-card h2 + p {
  color: var(--slate-500);
  font-size: 12px;
  margin-bottom: 22px;
}

.portfolio-gate {
  align-items: end;
  background: var(--ice-50);
  border-radius: 10px;
  display: flex;
  gap: 2px;
  justify-content: space-between;
  padding: 13px;
}

.portfolio-gate > div {
  display: grid;
  gap: 2px;
}

.portfolio-gate span {
  color: var(--slate-500);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
}

.portfolio-gate strong {
  color: var(--navy-900);
  font-size: 13px;
}

.portfolio-gate small {
  color: var(--slate-500);
  font-size: 10px;
}

.readiness-score {
  min-width: 58px;
  text-align: right;
}

.readiness-score strong {
  color: var(--cyan-700);
  font-size: 18px;
}

.readiness-track {
  background: var(--ice-100);
  border-radius: 99px;
  height: 5px;
  margin: -3px 13px 0;
  overflow: hidden;
}

.readiness-track i {
  background: linear-gradient(90deg, var(--cyan-500), var(--green));
  border-radius: inherit;
  display: block;
  height: 100%;
}

.portfolio-demo-banner {
  align-items: center;
  background: linear-gradient(105deg, var(--navy-900), #12394a);
  border: 1px solid rgb(88 207 229 / 0.24);
  border-radius: var(--radius);
  color: var(--white);
  display: flex;
  gap: 24px;
  justify-content: space-between;
  margin: 0 auto 14px;
  max-width: 1480px;
  padding: 16px 20px;
}

.portfolio-demo-banner > div:first-child {
  display: grid;
  gap: 3px;
}

.portfolio-demo-banner strong {
  font-size: 15px;
}

.portfolio-demo-banner small {
  color: #b8d4de;
  font-size: 10px;
}

.demo-kicker {
  color: var(--cyan-300);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.portfolio-distribution {
  align-items: center;
  display: flex;
  flex: 0 0 auto;
  gap: 8px;
}

.portfolio-distribution span {
  align-items: center;
  background: rgb(255 255 255 / 0.07);
  border: 1px solid rgb(255 255 255 / 0.1);
  border-radius: 999px;
  display: inline-flex;
  font-size: 9px;
  font-weight: 700;
  gap: 6px;
  padding: 7px 9px;
  white-space: nowrap;
}

.portfolio-distribution i {
  background: currentColor;
  border-radius: 50%;
  height: 7px;
  width: 7px;
}

.portfolio-distribution .dist-green { color: #6ee7b7; }
.portfolio-distribution .dist-yellow { color: #fcd34d; }
.portfolio-distribution .dist-red { color: #fca5a5; }

@media (max-width: 920px) {
  .portfolio-demo-banner {
    align-items: flex-start;
    flex-direction: column;
  }
}

@media (max-width: 560px) {
  .portfolio-distribution {
    align-items: flex-start;
    flex-direction: column;
  }
}

.portfolio-metrics {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(3, 1fr);
  margin-top: 16px;
}

.portfolio-metrics span {
  color: var(--slate-500);
  display: grid;
  font-size: 9px;
  gap: 2px;
}

.portfolio-metrics strong {
  color: var(--navy-700);
  font-size: 12px;
}

.mission-hero {
  align-items: center;
  background:
    linear-gradient(115deg, rgb(20 184 212 / 0.1), transparent 46%),
    var(--navy-900);
  border: 1px solid var(--navy-800);
  border-radius: var(--radius-lg);
  color: var(--white);
  display: grid;
  gap: 26px;
  grid-template-columns: 150px 1fr auto;
  margin: 0 auto 16px;
  max-width: 1480px;
  min-height: 210px;
  overflow: hidden;
  padding: 28px 34px;
  position: relative;
}

.mission-hero::after {
  background-image: linear-gradient(rgb(255 255 255 / 0.035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 0.035) 1px, transparent 1px);
  background-size: 24px 24px;
  content: "";
  inset: 0;
  mask-image: linear-gradient(90deg, #000, transparent 70%);
  pointer-events: none;
  position: absolute;
}

.mission-hero.level-yellow { border-color: rgb(167 102 5 / 0.6); }
.mission-hero.level-red { border-color: rgb(196 61 69 / 0.65); }

.mission-radar {
  border: 1px solid rgb(53 203 227 / 0.45);
  border-radius: 50%;
  height: 130px;
  position: relative;
  width: 130px;
  z-index: 1;
}

.mission-radar i {
  border: 1px solid rgb(53 203 227 / 0.25);
  border-radius: 50%;
  inset: 21px;
  position: absolute;
}

.mission-radar i:nth-child(2) { inset: 42px; }
.mission-radar i:nth-child(3) {
  border: 0;
  border-left: 1px solid rgb(53 203 227 / 0.4);
  border-radius: 0;
  inset: 0 0 0 50%;
}

.mission-radar span {
  background: var(--cyan-400);
  border-radius: 50%;
  box-shadow: 0 0 14px var(--cyan-400);
  height: 7px;
  left: 68%;
  position: absolute;
  top: 28%;
  width: 7px;
}

.mission-copy {
  position: relative;
  z-index: 1;
}

.mission-copy h2 {
  font-size: clamp(24px, 3vw, 38px);
  letter-spacing: -0.04em;
  margin: 0 0 7px;
}

.mission-copy > p:not(.eyebrow) {
  color: var(--cyan-200);
  font-size: 13px;
  margin-bottom: 13px;
}

.mission-copy small {
  color: #9bb2bd;
  display: block;
  line-height: 1.5;
  max-width: 650px;
}

.readiness-dial {
  align-items: center;
  background: conic-gradient(var(--cyan-400) calc(var(--progress) * 1%), rgb(255 255 255 / 0.1) 0);
  border-radius: 50%;
  display: flex;
  height: 132px;
  justify-content: center;
  position: relative;
  width: 132px;

    let moved = 0;
    while (moved < steps) {
      date.setUTCDate(date.getUTCDate() + direction);
      if (mode === "calendar" || isWorkday(date, blackoutDates)) moved += 1;
    }
    return isoDate(date);
  }

  function diffDays(startValue, finishValue, mode = "calendar", blackoutDates = []) {
    const start = parseDate(startValue);
    const finish = parseDate(finishValue);
    if (!start || !finish) return NaN;
    if (mode === "calendar") {
      return Math.round((finish.getTime() - start.getTime()) / DAY_MS);
    }
    const direction = finish >= start ? 1 : -1;
    let cursor = new Date(start);
    let count = 0;
    while (isoDate(cursor) !== isoDate(finish)) {
      cursor.setUTCDate(cursor.getUTCDate() + direction);
      if (isWorkday(cursor, blackoutDates)) count += direction;
      if (Math.abs(count) > 10000) return NaN;
    }
    return count;
  }

  function resolveTemplate(templateId) {
    const requested = scheduleTemplates[templateId] || scheduleTemplates.custom;
    if (!requested.cloneFrom) return requested;
    const base = scheduleTemplates[requested.cloneFrom];
    return { ...requested, tasks: base.tasks };
  }

  function generateSchedule(templateId, anchorKey, anchorDate, mode = "calendar", blackoutDates = []) {
    const template = resolveTemplate(templateId);
    const selectedKey = template.tasks.some((row) => row[0] === anchorKey)
      ? anchorKey
      : template.defaultAnchorKey;
    const anchorRow = template.tasks.find((row) => row[0] === selectedKey);
    const origin = addDays(anchorDate, -anchorRow[5], mode, blackoutDates);
    const idMap = {};
    template.tasks.forEach((row) => {
      idMap[row[0]] = uid("task");
    });
    return template.tasks.map((row) => {
      const [templateKey, name, phase, gate, type, startOffset, duration, dependencies, critical, ownerRole] = row;
      const start = addDays(origin, startOffset, mode, blackoutDates);
      return {
        id: idMap[templateKey],
        templateKey,
        name,
        phase,
        gate,
        type,
        ownerRole,
        baselineStart: start,
        baselineFinish: addDays(start, duration, mode, blackoutDates),
        currentStart: start,
        currentFinish: addDays(start, duration, mode, blackoutDates),
        duration,
        dependencies: dependencies.map((key) => idMap[key]).filter(Boolean),
        critical,
        optional: !critical,
        status: "Not Started",
        weight: critical ? 3 : 1,
        override: false,
      };
    });
  }

  function validateTimeline(items) {
    const errors = [];
    const byId = new Map(items.map((item) => [item.id, item]));
    items.forEach((item) => {
      if (!parseDate(item.currentStart) || !parseDate(item.currentFinish)) {
        errors.push({ itemId: item.id, type: "invalid-date", message: `${item.name} has an invalid date.` });
      } else if (item.currentFinish < item.currentStart) {
        errors.push({ itemId: item.id, type: "negative-duration", message: `${item.name} finishes before it starts.` });
      }
      (item.dependencies || []).forEach((dependencyId) => {
        const dependency = byId.get(dependencyId);
        if (!dependency) {
          errors.push({ itemId: item.id, type: "missing-dependency", message: `${item.name} has a missing dependency.` });
        } else if (dependency.currentFinish > item.currentStart && dependency.type !== "milestone") {
          errors.push({ itemId: item.id, type: "dependency-overlap", message: `${item.name} starts before ${dependency.name} finishes.` });
        }
      });
    });

    const visiting = new Set();
    const visited = new Set();
    function visit(id) {
      if (visiting.has(id)) return true;
      if (visited.has(id)) return false;
      visiting.add(id);
      const item = byId.get(id);
      for (const dep of item?.dependencies || []) {
        if (visit(dep)) return true;
      }
      visiting.delete(id);
      visited.add(id);
      return false;
    }
    for (const item of items) {
      if (visit(item.id)) {
        errors.push({ itemId: item.id, type: "cycle", message: "The schedule contains a dependency cycle." });
        break;
      }
    }
    return errors;
  }

  function isComplete(status) {
    return COMPLETE_STATUSES.has(status);
  }

  function nextGate(estimate, now = todayIso()) {
    const candidates = estimate.timelineItems
      .filter((item) => item.type === "milestone" && !isComplete(item.status))
      .sort((a, b) => a.currentFinish.localeCompare(b.currentFinish));
    return candidates.find((item) => item.currentFinish >= now) || candidates[0] || null;
  }

  function itemsDueByGate(items, estimate, gate) {
    if (!gate) return items;
    const gateDate = gate.currentFinish;
    const gateDates = new Map();
    estimate.timelineItems.forEach((item) => {
      if (!gateDates.has(item.gate) || item.currentFinish < gateDates.get(item.gate)) {
        gateDates.set(item.gate, item.currentFinish);
      }
    });
    return items.filter((item) => {
      const due = gateDates.get(item.gateDue);
      return !due || due <= gateDate;
    });
  }

  function weightedProgress(items, statusGetter) {
    let total = 0;
    let earned = 0;
    items.forEach((item) => {
      if (item.applicability === "Not Applicable") return;
      const score = ITEM_SCORES[statusGetter(item)];
      if (score === null || score === undefined) return;
      const weight = item.critical ? 3 : 1;
      total += weight;
      earned += weight * score;
    });
    return total ? Math.round((earned / total) * 100) : 100;
  }

  function readinessSummary(estimate, now = todayIso()) {
    const gate = nextGate(estimate, now);
    const timeline = estimate.timelineItems.filter(
      (item) => !gate || item.currentFinish <= gate.currentFinish,
    );
    const deliverables = itemsDueByGate(estimate.deliverables, estimate, gate).filter(
      (item) => item.applicability === "Required",
    );
    const midstream = itemsDueByGate(estimate.midstreamItems, estimate, gate).filter(
      (item) => item.applicability !== "Not Applicable",
    );
    const reviews = itemsDueByGate(estimate.reviewItems, estimate, gate).filter(
      (item) => item.applicability !== "Not Applicable",
    );
    const components = {
      Timeline: weightedProgress(timeline, (item) => item.status),
      Deliverables: weightedProgress(deliverables, (item) =>
        item.reviewStatus === "Verified" ? "Verified" : item.status,
      ),
      "Review checklist": Math.round(
        (weightedProgress(midstream, (item) => item.status) +
          weightedProgress(reviews, reviewItemStatus)) /
          2,
      ),
    };
    return {
      gate,
      components,
      pct: Math.round(
        (components.Timeline * 0.3 +
          components.Deliverables * 0.35 +
          components["Review checklist"] * 0.35),
      ),
    };
  }

  function scheduleStoplight(estimate, now, warningDays) {
    const conflicts = validateTimeline(estimate.timelineItems);
    if (conflicts.length) return { level: "red", pct: 0, reason: `Red: ${conflicts[0].message}` };
    const open = estimate.timelineItems.filter((item) => !isComplete(item.status));
    const overdueCritical = open.find((item) => item.critical && item.currentFinish < now);
    if (overdueCritical) {
      const days = Math.abs(diffDays(overdueCritical.currentFinish, now, "calendar"));
      return { level: "red", pct: 0, reason: `Red: ${overdueCritical.name} is ${days} day${days === 1 ? "" : "s"} overdue.` };
    }
    const overdue = open.find((item) => item.currentFinish < now);
    if (overdue) return { level: "yellow", pct: 60, reason: `Yellow: ${overdue.name} is overdue.` };
    const dueSoon = open.find(
      (item) => item.critical && diffDays(now, item.currentFinish, "calendar") <= warningDays,
    );
    if (dueSoon) return { level: "yellow", pct: 75, reason: `Yellow: ${dueSoon.name} is due within ${warningDays} days.` };
    return { level: "green", pct: 100, reason: "Green: No overdue critical tasks or schedule conflicts." };
  }

  function midstreamStoplight(estimate, gate) {
    const items = itemsDueByGate(estimate.midstreamItems, estimate, gate).filter(
      (item) => item.applicability !== "Not Applicable",
    );
    const pct = weightedProgress(items, (item) => item.status);
    const blocked = items.find((item) => item.status === "Blocked");
    const criticalNotStarted = items.find((item) => item.critical && item.status === "Not Started");
    const criticalInProgress = items.find(
      (item) => item.critical && ["Draft", "In Progress"].includes(item.status),
    );
    if (blocked) return { level: "red", pct, reason: `Red: ${blocked.requirement} is blocked.` };
    if (criticalNotStarted) return { level: "red", pct, reason: `Red: Critical readiness item not started, ${criticalNotStarted.requirement}.` };
    if (pct < 70) return { level: "red", pct, reason: `Red: Next-gate readiness is ${pct} percent.` };
    if (criticalInProgress || pct < 90) return { level: "yellow", pct, reason: `Yellow: Next-gate readiness is ${pct} percent.` };
    return { level: "green", pct, reason: `Green: Next-gate readiness is ${pct} percent with no critical gap.` };
  }

  function deliverableStoplight(estimate, gate) {
    const items = itemsDueByGate(estimate.deliverables, estimate, gate).filter(
      (item) => item.applicability === "Required",
    );
    const pct = weightedProgress(items, (item) =>
      item.reviewStatus === "Verified" ? "Verified" : item.status,
    );
    const blocked = items.find((item) => item.status === "Blocked");
    const missing = items.find((item) => item.critical && item.status === "Not Started");
    if (blocked) return { level: "red", pct, reason: `Red: Required deliverable blocked, ${blocked.name}.` };
    if (missing || pct < 70) return { level: "red", pct, reason: `Red: Required deliverables are ${pct} percent ready.` };
    const awaiting = items.filter((item) => item.status === "Ready for Review" && item.reviewStatus !== "Verified");
    if (pct < 90 || awaiting.length) {
      return { level: "yellow", pct, reason: `Yellow: ${awaiting.length || "Some"} required deliverable${awaiting.length === 1 ? "" : "s"} await verification.` };
    }
    return { level: "green", pct, reason: `Green: Required deliverables are ${pct} percent ready.` };
  }

  function reviewItemStatus(item) {
    const applicable = Object.values(item.artifactStatuses || {}).filter((status) => status !== "Not Applicable");
    if (!applicable.length) return item.reviewStatus;
    if (applicable.includes("Returned for Action")) return "Returned for Action";
    if (applicable.includes("Not Started")) return "Not Started";
    if (applicable.includes("In Progress")) return "In Progress";
    if (applicable.includes("Implemented")) return "Implemented";
    if (applicable.includes("Analyst Checked")) return "Analyst Checked";
    return applicable.every((status) => status === "SME Verified") ? "SME Verified" : item.reviewStatus;
  }

  function checklistStoplight(estimate, gate) {
    const items = itemsDueByGate(estimate.reviewItems, estimate, gate).filter(
      (item) => item.applicability !== "Not Applicable",
    );
    const pct = weightedProgress(items, reviewItemStatus);
    const failure = items.find((item) => {
      const status = reviewItemStatus(item);
      return item.critical && ["Not Started", "Blocked", "Returned for Action"].includes(status);
    });
    const staleRule = items.find((item) => item.managerConfirmation && !item.managerConfirmed);
    if (failure) return { level: "red", pct, reason: `Red: Critical review item needs action, ${failure.requirement}.` };
    if (pct < 70) return { level: "red", pct, reason: `Red: SME checklist readiness is ${pct} percent.` };
    if (staleRule) return { level: "yellow", pct, reason: "Yellow: A time-sensitive rule still needs manager confirmation." };
    if (pct < 90) return { level: "yellow", pct, reason: `Yellow: SME checklist readiness is ${pct} percent.` };
    return { level: "green", pct, reason: `Green: SME checklist readiness is ${pct} percent.` };
  }

  function issuesStoplight(estimate, now) {
    const open = estimate.issues.filter((issue) => !["Closed", "Accepted"].includes(issue.status));
    const blocker = open.find((issue) => issue.severity === "Blocker" || issue.blocksNextGate);
    if (blocker) return { level: "red", pct: 0, reason: `Red: Open blocker, ${blocker.category}.` };
    const overdueHigh = open.find((issue) => issue.severity === "High" && issue.dueDate < now);
    if (overdueHigh) return { level: "red", pct: 0, reason: `Red: High issue is overdue, ${overdueHigh.category}.` };
    const high = open.find((issue) => issue.severity === "High");
    const medium = open.find((issue) => issue.severity === "Medium");
    if (high || medium) return { level: "yellow", pct: 60, reason: `Yellow: ${high ? "High" : "Medium"} issue remains open.` };
    return { level: "green", pct: 100, reason: "Green: No open High or Blocker issues." };
  }

  function configurationStoplight(estimate) {
    const versions = estimate.artifactVersions || {};
    const values = REVIEW_ARTIFACTS.map((key) => versions[key]).filter(Boolean);
    const aligned = versions.aligned && new Set(values).size <= 1;
    if (aligned) return { level: "green", pct: 100, reason: "Green: PowerPoint, ACE, and Excel/POST versions are aligned." };
    const ready = estimate.deliverables.some((item) => ["Ready for Review", "Verified"].includes(item.status));
    if (ready) return { level: "red", pct: 0, reason: "Red: Package versions conflict after results were marked ready." };
    return { level: "yellow", pct: 60, reason: "Yellow: One or more package artifacts need refresh or verification." };
  }

  function computeStoplights(estimate, now = todayIso(), warningDays = 7) {
    const gate = nextGate(estimate, now);
    const dimensions = {
      Schedule: scheduleStoplight(estimate, now, warningDays),
      "Requirements / Midstream": midstreamStoplight(estimate, gate),
      Deliverables: deliverableStoplight(estimate, gate),
      "SME Checklist": checklistStoplight(estimate, gate),
      Issues: issuesStoplight(estimate, now),
      "Configuration Control": configurationStoplight(estimate),
    };
    const levels = Object.values(dimensions).map((item) => item.level);
    const level = levels.includes("red") ? "red" : levels.includes("yellow") ? "yellow" : "green";
    const first = Object.entries(dimensions).find(([, item]) => item.level === level);
    return {
      gate,
      overall: {
        level,
        reason: first ? `Overall ${level}: ${first[0]} is ${level}. ${first[1].reason.replace(/^(Red|Yellow|Green):\s*/, "")}` : "No status available.",
      },
      dimensions,
    };
  }

  function prioritizedActions(estimate, now = todayIso(), warningDays = 7) {
    const actions = [];
    const gate = nextGate(estimate, now);
    const dueDeliverables = itemsDueByGate(estimate.deliverables, estimate, gate);
    const dueMidstream = itemsDueByGate(estimate.midstreamItems, estimate, gate);
    const dueReviews = itemsDueByGate(estimate.reviewItems, estimate, gate);
    estimate.timelineItems
      .filter((item) => !isComplete(item.status) && item.currentFinish < now && item.critical)
      .forEach((item) => actions.push({ priority: 1, type: "Overdue critical task", label: item.name, due: item.currentFinish }));
    estimate.issues
      .filter((issue) => !["Closed", "Accepted"].includes(issue.status) && (issue.severity === "Blocker" || issue.blocksNextGate))
      .forEach((issue) => actions.push({ priority: 1, type: "Open gate blocker", label: issue.category, due: issue.dueDate }));
    dueMidstream
      .filter((item) => item.applicability !== "Not Applicable" && item.critical && ["Not Started", "Blocked"].includes(item.status))
      .forEach((item) => actions.push({ priority: 2, type: "Critical readiness gap", label: item.requirement, due: gate?.currentFinish || "" }));
    dueReviews
      .filter((item) => item.applicability !== "Not Applicable" && item.critical && ["Not Started", "Returned for Action"].includes(reviewItemStatus(item)))
      .forEach((item) => actions.push({ priority: 2, type: "Critical checklist gap", label: item.requirement, due: gate?.currentFinish || "" }));
    dueDeliverables
      .filter((item) => item.applicability === "Required" && item.critical && ["Not Started", "Draft", "Blocked"].includes(item.status))
      .forEach((item) => actions.push({ priority: 2, type: "Required deliverable not ready", label: item.name, due: gate?.currentFinish || "" }));
    estimate.timelineItems
      .filter((item) => {
        const days = diffDays(now, item.currentFinish, "calendar");
        return !isComplete(item.status) && item.critical && days >= 0 && days <= warningDays;
      })
      .forEach((item) => actions.push({ priority: 3, type: "Critical item due soon", label: item.name, due: item.currentFinish }));
    dueDeliverables
      .filter((item) => item.applicability === "Required" && item.status === "Ready for Review" && item.reviewStatus !== "Verified")
      .forEach((item) => actions.push({ priority: 3, type: "Awaiting SME review", label: item.name, due: gate?.currentFinish || "" }));
    estimate.timelineItems
      .filter((item) => !isComplete(item.status) && item.currentFinish < now && !item.critical)
      .forEach((item) => actions.push({ priority: 4, type: "Overdue task", label: item.name, due: item.currentFinish }));
    const sorted = actions.sort(
      (a, b) => a.priority - b.priority || String(a.due).localeCompare(String(b.due)),
    );
    const selectedActions = [];
    const typeCounts = new Map();
    for (const action of sorted) {
      const count = typeCounts.get(action.type) || 0;
      if (count >= 2) continue;
      selectedActions.push(action);
      typeCounts.set(action.type, count + 1);
      if (selectedActions.length === 5) break;
    }
    return selectedActions;
  }

  function createWorkspace() {
    return {
      schemaVersion: SCHEMA_VERSION,
      appVersion: APP_VERSION,
      preferences: {
        acknowledged: false,
        calendarMode: "calendar",
        warningDays: 7,
        blackoutDates: [],
        density: "comfortable",
        theme: "mission",
        defaultTemplate: "sbe",
      },
      checklistLibraries: [{ id: "slide-37-2026-01", version: "January 2026", source: "SYD 85 Slide 37", active: true }],
      scheduleTemplates: Object.values(scheduleTemplates).map((template) => ({
        id: template.id,
        name: template.name,
        version: template.version,
        source: template.source,
      })),
      estimates: [],
      updatedAt: new Date().toISOString(),
    };
  }

  function createDemoWorkspace() {
    const workspace = createWorkspace();
    workspace.preferences.acknowledged = true;
    workspace.preferences.warningDays = 10;
    const profiles = [
      {
        alias: "FY27 Enterprise SBE", analyst: "Analyst 01", product: "Signature SBE",
        purpose: "POM support", template: "sbe", anchorOffset: -12, progress: 5,
        mode: "blocked", versions: ["v0.4", "v0.3", "v0.4"],
      },
      {
        alias: "Capability Alpha POE", analyst: "Analyst 02", product: "POE",
        purpose: "Program decision", template: "poe", anchorOffset: 18, progress: 7,
        mode: "review", versions: ["v0.7", "v0.7", "v0.7"],
      },
      {
        alias: "Services Recompete IGCE", analyst: "Analyst 03", product: "IGCE",
        purpose: "Acquisition support", template: "igce", anchorOffset: 42, progress: 10,
        mode: "on-track", versions: ["v0.8", "v0.8", "v0.8"],
      },
      {
        alias: "Portfolio Excursion 02", analyst: "Analyst 04", product: "Excursion",
        purpose: "Leadership excursion", template: "excursion", anchorOffset: -4, progress: 3,
        mode: "schedule-watch", versions: ["v0.2", "v0.2", "v0.2"],
      },
      {
        alias: "Sustainment Refresh", analyst: "Analyst 05", product: "Program Office Estimate",
        purpose: "Baseline update", template: "poe", anchorOffset: 30, progress: 4,
        mode: "checklist-gap", versions: ["v0.5", "v0.5", "v0.5"],
      },
      {
        alias: "Investment Strategy SBE", analyst: "Analyst 06", product: "Signature SBE",
        purpose: "Investment strategy", template: "sbe", anchorOffset: 75, progress: 8,
        mode: "on-track", versions: ["v0.6", "v0.6", "v0.6"],
      },
    ];

    profiles.forEach((profile) => {
      const estimate = newEstimate({
        sanitizedAlias: profile.alias,
        analystAlias: profile.analyst,
        productType: profile.product,
        purposeCategory: profile.purpose,
        scopeCategory: "Full program / portfolio",
        estimatePhase: "Investment and sustainment",
        costPhaseFlags: { rdte: true, procurement: true, os: true },
        templateId: profile.template,
        anchorEvent: "syd-kickoff",
        anchorDate: addDays(todayIso(), profile.anchorOffset, "calendar"),
        calendarMode: "calendar",
        blackoutDates: [],
      });

      estimate.timelineItems.forEach((item, index) => {
        item.status = index < profile.progress ? "Complete" : index === profile.progress ? "In Progress" : "Not Started";
      });
      const activeTimelineItem = estimate.timelineItems.find((item) => item.status === "In Progress");
      estimate.midstreamItems.forEach((item, index) => {
        item.status = index < profile.progress + 3 ? "Complete" : index < profile.progress + 7 ? "In Progress" : "Not Started";
      });
      estimate.deliverables.forEach((item, index) => {
        if (item.applicability === "Not Applicable") return;
        item.status = index < profile.progress ? "Verified" : index < profile.progress + 4 ? "Draft" : "Not Started";
        item.reviewStatus = index < profile.progress ? "Verified" : "Not Started";
        item.slideReference = index < profile.progress + 4 ? String(index + 1) : "";
      });
      estimate.reviewItems.forEach((item, index) => {
        Object.keys(item.artifactStatuses).forEach((artifact) => {
          if (item.artifactStatuses[artifact] !== "Not Applicable") {
            item.artifactStatuses[artifact] = index < profile.progress ? "SME Verified" : index < profile.progress + 4 ? "In Progress" : "Not Started";
          }
        });
        item.reviewStatus = index < profile.progress ? "SME Verified" : index < profile.progress + 4 ? "In Progress" : "Not Started";
      });
      estimate.artifactVersions = {
        PowerPoint: profile.versions[0],
        ACE: profile.versions[1],
        "Excel/POST": profile.versions[2],
        aligned: new Set(profile.versions).size === 1,
      };

      if (profile.mode === "on-track") {
        estimate.timelineItems.forEach((item) => {
          if (item.currentFinish <= activeTimelineItem?.currentFinish) item.status = "Complete";
        });
        estimate.midstreamItems.forEach((item) => { item.status = "Complete"; });
        estimate.deliverables.forEach((item) => {
          if (item.applicability !== "Not Applicable") {
            item.status = "Verified";
            item.reviewStatus = "Verified";
          }
        });
        estimate.reviewItems.forEach((item) => {
          Object.keys(item.artifactStatuses).forEach((artifact) => {
            if (item.artifactStatuses[artifact] !== "Not Applicable") item.artifactStatuses[artifact] = "SME Verified";
          });
          item.reviewStatus = "SME Verified";
          item.managerConfirmed = true;
        });
      } else if (profile.mode === "review") {
        estimate.midstreamItems.forEach((item) => { item.status = "Complete"; });
        estimate.reviewItems.forEach((item) => {
          Object.keys(item.artifactStatuses).forEach((artifact) => {
            if (item.artifactStatuses[artifact] !== "Not Applicable") item.artifactStatuses[artifact] = "SME Verified";
          });
          item.reviewStatus = "SME Verified";
          item.managerConfirmed = true;
        });
        estimate.deliverables.forEach((item) => {
          if (item.applicability !== "Not Applicable") {
            item.status = "Verified";
            item.reviewStatus = "Verified";
          }
        });
        const awaiting = estimate.deliverables.find((item) => item.applicability === "Required" && item.status === "Draft");
        const reviewCandidate = awaiting || estimate.deliverables.find((item) => item.applicability === "Required");
        if (reviewCandidate) {
          reviewCandidate.status = "Ready for Review";
          reviewCandidate.reviewStatus = "Not Started";
          reviewCandidate.gateDue = activeTimelineItem?.gate || reviewCandidate.gateDue;
        }
      } else if (profile.mode === "blocked") {
        const awaiting = estimate.deliverables.find((item) => item.applicability === "Required" && item.status === "Draft");
        if (awaiting) awaiting.status = "Ready for Review";
        estimate.issues.push({
          id: uid("issue"),
          category: "Configuration / version mismatch",
          linkedArtifactType: "Package",
          linkedArtifactId: "",
          severity: "High",
          ownerRole: "Analyst",
          openedDate: todayIso(),
          dueDate: addDays(todayIso(), 5),
          status: "In Progress",
          resolutionDisposition: "",
          sanitizedSummary: "ACE package refresh is pending before the next review.",
          blocksNextGate: true,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        });
      } else if (profile.mode === "checklist-gap") {
        const critical = estimate.midstreamItems.find((item) => item.critical);
        if (critical) critical.status = "Blocked";
      } else if (profile.mode === "schedule-watch") {
        const openCritical = estimate.timelineItems.find((item) => item.critical && !isComplete(item.status));
        if (openCritical) {
          openCritical.currentStart = addDays(todayIso(), -3);
          openCritical.currentFinish = addDays(todayIso(), -1);
        }
      }
      estimate.updatedAt = new Date().toISOString();
      workspace.estimates.push(estimate);
    });
    return workspace;
  }

  function validateWorkspace(candidate) {
    const errors = [];
    if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) errors.push("Import must contain one workspace object.");
    if (candidate?.schemaVersion !== SCHEMA_VERSION) errors.push(`Unsupported schema version. Expected ${SCHEMA_VERSION}.`);
    if (!Array.isArray(candidate?.estimates)) errors.push("Workspace estimates must be an array.");
    if (candidate?.estimates?.length > 250) errors.push("Workspace contains too many estimates.");

    const unsafe = /<\s*script|javascript\s*:|data\s*:\s*text\/html|onerror\s*=|onload\s*=/i;
    const walk = (value, path = "workspace") => {
      if (typeof value === "string") {
        if (value.length > 5000) errors.push(`${path} exceeds the allowed length.`);
        if (unsafe.test(value)) errors.push(`${path} contains executable content.`);
      } else if (Array.isArray(value)) {
        value.forEach((entry, index) => walk(entry, `${path}[${index}]`));
      } else if (value && typeof value === "object") {
        Object.entries(value).forEach(([key, entry]) => walk(entry, `${path}.${key}`));
      }
    };
    walk(candidate);

    const ids = new Set();
    (candidate?.estimates || []).forEach((estimate, index) => {
      if (!estimate.id || ids.has(estimate.id)) errors.push(`Estimate ${index + 1} has a missing or duplicate ID.`);
      ids.add(estimate.id);
      if (!String(estimate.sanitizedAlias || "").trim()) errors.push(`Estimate ${index + 1} is missing an alias.`);
      if (!Array.isArray(estimate.timelineItems)) errors.push(`Estimate ${index + 1} has no timeline.`);
      const timelineIds = new Set((estimate.timelineItems || []).map((item) => item.id));
      (estimate.timelineItems || []).forEach((item) => {
        (item.dependencies || []).forEach((dependency) => {
          if (!timelineIds.has(dependency)) errors.push(`${estimate.sanitizedAlias} contains an invalid dependency.`);
        });
      });
    });
    return { valid: errors.length === 0, errors };
  }

  root.EMCCore = {
    APP_VERSION,
    SCHEMA_VERSION,
    TEMPLATE_VERSION,
    REVIEW_ARTIFACTS,
    ITEM_SCORES,
    addDays,
    computeStoplights,
    createDemoWorkspace,
    createWorkspace,
    diffDays,
    generateSchedule,
    isComplete,
    newEstimate,
    nextGate,
    parseDate,
    prioritizedActions,
    resolveTemplate,
    scheduleTemplates,
    seedDeliverables,
    seedMidstream,
    seedReviewItems,
    todayIso,
    uid,
    validateTimeline,
    validateWorkspace,
    weightedProgress,
    readinessSummary,
  };
})(globalThis);

  <script>
(function startEstimateMissionControl(root) {
  "use strict";

  const C = root.EMCCore;
  const mount = document.getElementById("emc-root");
  if (!C || !mount) return;

  const DB_NAME = "estimate-mission-control-v1";

  function openDatabase() {
    return new Promise((resolve) => {
      if (!("indexedDB" in root)) return resolve(null);
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = () => {
        if (!request.result.objectStoreNames.contains(DB_STORE)) {
          request.result.createObjectStore(DB_STORE);
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => resolve(null);
    });
  }

  function dbGet(key) {
    if (!db) {
      try {
        return Promise.resolve(JSON.parse(localStorage.getItem(FALLBACK_KEY) || "null"));
      } catch {
        return Promise.resolve(null);
      }
    }
    return new Promise((resolve) => {
      const request = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(key);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => resolve(null);
    });
  }

  function dbPut(key, value) {
    if (!db) {
      localStorage.setItem(FALLBACK_KEY, JSON.stringify(value));
      return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
      const request = db.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).put(value, key);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  function dbDelete(key) {
    if (!db) {
      localStorage.removeItem(FALLBACK_KEY);
      return Promise.resolve();
    }
    return new Promise((resolve) => {
      const request = db.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).delete(key);
      request.onsuccess = () => resolve();
      request.onerror = () => resolve();
    });
  }

  function migrateWorkspace(candidate) {
    const freshMidstream = C.seedMidstream();
    const freshDeliverables = C.seedDeliverables();
    const oldSlideCheck = "All numbers check from slide to slide";
    const currentSlideCheck = "All numbers reconcile across BLUF, Get Well Plan, Cost Track, Time Phased Cost Track, and Phased Cost Reports";

    candidate.appVersion = C.APP_VERSION;
    candidate.estimates.forEach((estimate) => {
      estimate.midstreamItems ||= [];
      estimate.deliverables ||= [];
      estimate.reviewItems ||= [];

      freshMidstream.forEach((seed) => {
        if (!estimate.midstreamItems.some((item) => item.requirement === seed.requirement)) {
          estimate.midstreamItems.push(seed);
        }
      });
      freshDeliverables.forEach((seed) => {
        if (!estimate.deliverables.some((item) => item.name === seed.name)) {
          estimate.deliverables.push(seed);
        }
      });
      estimate.reviewItems.forEach((item) => {
        if (item.requirement === oldSlideCheck) item.requirement = currentSlideCheck;
      });
    });
    return candidate;
  }

        <div class="mission-copy">
          <p class="eyebrow">Next decision gate</p>
          <h2>${escapeHtml(gate?.gate || "All scheduled gates complete")}</h2>
          <p>${gate ? `${formatDate(gate.currentFinish)} • ${daysUntil(gate.currentFinish)}` : "No open milestone remains in the current schedule."}</p>
          <small>${escapeHtml(status.overall.reason)}</small>
        </div>
        <div class="readiness-dial" style="--progress:${readiness.pct}" title="Timeline ${readiness.components.Timeline}%, deliverables ${readiness.components.Deliverables}%, review checklist ${readiness.components["Review checklist"]}%">

        ${Object.entries(status.dimensions).map(([name, item]) => `
          <article class="status-card level-${item.level}">
            <div class="status-card-head"><span class="status-signal"><i></i><b>${statusLabel(item.level)}</b></span><strong>${item.pct}%</strong></div>
            <h3>${escapeHtml(name)}</h3>
            <p>${escapeHtml(item.reason)}</p>

      <section class="dashboard-columns dashboard-primary">
        <article class="panel">
          <div class="panel-head"><div><p class="eyebrow">Prioritized</p><h2>Next actions</h2></div><button class="text-button" data-action="nav" data-view="issues">View issues ${icon("chevron")}</button></div>
          <ol class="action-list">
            ${actions.length ? actions.map((action, index) => `<li><span class="priority-num">${index + 1}</span><div><strong>${escapeHtml(action.label)}</strong><small>${escapeHtml(action.type)}${action.due ? ` • ${formatDate(action.due, true)}` : ""}</small></div></li>`).join("") : `<li class="clear-state">${icon("check")}<div><strong>No urgent actions</strong><small>Timeline, deliverables, checklist, and issue rules are clear for the next gate.</small></div></li>`}
          </ol>
        </article>
        <article class="panel">
          <div class="panel-head"><div><p class="eyebrow">Schedule</p><h2>Upcoming milestones</h2></div><button class="text-button" data-action="nav" data-view="timeline">Full timeline ${icon("chevron")}</button></div>
          <div class="milestone-list">
            ${upcoming.length ? upcoming.map((item, index) => `<div><span class="timeline-dot ${index === 0 ? "active" : ""}"></span><div class="milestone-copy"><strong>${escapeHtml(item.name)}</strong><small>${formatDate(item.currentFinish)} • ${escapeHtml(item.ownerRole)}</small></div><span class="task-status status-${statusClass(item.status)}">${escapeHtml(item.status)}</span></div>`).join("") : '<p class="muted">No upcoming milestones.</p>'}
          </div>
        </article>
      </section>
      <section class="dashboard-columns compact">
        <article class="panel config-panel">
          <div class="panel-head"><div><p class="eyebrow">Configuration control</p><h2>Current package</h2></div><span class="stoplight-pill level-${status.dimensions["Configuration Control"].level}"><i></i>${statusLabel(status.dimensions["Configuration Control"].level)}</span></div>
          <div class="version-row">
            ${C.REVIEW_ARTIFACTS.map((name) => `<div><span>${escapeHtml(name)}</span><strong>${escapeHtml(estimate.artifactVersions[name] || "Not set")}</strong></div>`).join("")}
          </div>
        </article>
        <article class="panel blocker-panel">
          <div class="panel-head"><div><p class="eyebrow">Gate blockers</p><h2>${blockers.length ? `${blockers.length} open` : "Clear"}</h2></div></div>
          ${blockers.length ? blockers.slice(0, 3).map((issue) => `<div class="blocker-item">${icon("alert")}<span><strong>${escapeHtml(issue.category)}</strong><small>${escapeHtml(issue.ownerRole)} • due ${formatDate(issue.dueDate, true)}</small></span></div>`).join("") : `<div class="clear-banner">${icon("check")} No issue is marked as blocking the next gate.</div>`}
        </article>
      </section>
    `;
  }

  function renderTimeline(estimate) {
    const errors = C.validateTimeline(estimate.timelineItems);
    const filter = ui.filters.timeline;
    const rows = estimate.timelineItems.filter((item) => filter === "All" || item.phase === filter);
    const starts = rows.map((item) => item.currentStart).sort();
    const finishes = rows.map((item) => item.currentFinish).sort();
    const naturalMin = starts[0] || C.todayIso();
    const naturalMax = finishes[finishes.length - 1] || naturalMin;
    const min = ui.timelineView.start || naturalMin;
    const max = ui.timelineView.end || naturalMax;
    const span = Math.max(1, C.diffDays(min, max));
    const scale = ui.timelineView.scale;
    const pixelsPerDay = scale === "day" ? 26 : scale === "week" ? 9 : scale === "month" ? 3 : 0;
    const chartWidth = pixelsPerDay ? `${Math.max(420, span * pixelsPerDay)}px` : "100%";
    const gridDays = scale === "day" ? 1 : scale === "week" ? 7 : scale === "month" ? 30 : Math.max(1, Math.round(span / 4));
    const gridSize = pixelsPerDay ? `${gridDays * pixelsPerDay}px` : "25%";
    const phases = [...new Set(estimate.timelineItems.map((item) => item.phase))];
    return `
      ${pageHead(
        "Review schedule",
        "Baseline, current plan, and dependencies",
        `${estimate.templateSource}. Totals are calculated from dates, not copied from source graphics.`,
        `<button class="button button-secondary" data-action="baseline-reset">Restore baseline</button><button class="button button-primary" data-action="open-add-task">${icon("plus")} Add task</button>`,
      )}
      ${errors.length ? `<div class="alert alert-danger" role="alert">${icon("alert")}<div><strong>Schedule logic conflict</strong><p>${escapeHtml(errors[0].message)} Resolve conflicts before relying on the schedule stoplight.</p></div></div>` : ""}
      ${!C.resolveTemplate(estimate.templateId).officialSeed ? `<div class="alert alert-warning">${icon("alert")}<div><strong>Local default, confirm before use</strong><p>This template is configurable guidance, not an official numeric schedule from the source deck.</p></div></div>` : ""}
      <section class="toolbar">
        <label>Phase <select data-action="timeline-filter"><option>All</option>${phases.map((phase) => `<option${selected(phase, filter)}>${escapeHtml(phase)}</option>`).join("")}</select></label>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <label>Chart scale <select data-action="timeline-scale">${[["fit", "Fit"], ["day", "Daily"], ["week", "Weekly"], ["month", "Monthly"]].map(([value, label]) => `<option value="${value}"${selected(value, scale)}>${label}</option>`).join("")}</select></label>
        <label>Chart start <input type="date" data-action="timeline-start" value="${attr(ui.timelineView.start)}" placeholder="${attr(naturalMin)}"></label>
        <label>Chart end <input type="date" data-action="timeline-end" value="${attr(ui.timelineView.end)}" placeholder="${attr(naturalMax)}"></label>
        <button class="button button-tertiary button-small" data-action="timeline-view-reset">Fit schedule</button>
        <span class="toolbar-note">${estimate.calendarMode === "weekday" ? "Weekday mode, weekends and blackout dates excluded" : "Calendar-day mode"} • ${rows.length} visible tasks</span>
      </section>
      <section class="timeline-layout">
        <div class="table-wrap timeline-table-wrap">
          <table class="data-table timeline-table" style="width:${ui.timelineColumns.reduce((sum, width) => sum + width, 0)}px">
            <colgroup>${ui.timelineColumns.map((width) => `<col style="width:${width}px">`).join("")}</colgroup>
            <thead><tr>${["Task / Gate", "Owner", "Status", "Dependency", "Baseline", "Current start", "Current finish", "Variance", "Controls"].map((label, index) => `<th>${label}<span class="column-resizer" data-column="${index}" role="separator" aria-label="Resize ${label} column"></span></th>`).join("")}</tr></thead>
            <tbody>
              ${rows.map((item) => {
                const variance = C.diffDays(item.baselineFinish, item.currentFinish, estimate.calendarMode, workspace.preferences.blackoutDates);
                return `<tr class="${item.critical ? "critical-row" : ""}">
                  <td>
                    <span class="type-marker ${item.type}"></span>
                    <input class="task-name-input" maxlength="80" value="${attr(item.name)}" data-action="timeline-field" data-id="${attr(item.id)}" data-field="name" aria-label="Task name">
                    <div class="task-meta-inputs">
                      <input maxlength="40" value="${attr(item.phase)}" data-action="timeline-field" data-id="${attr(item.id)}" data-field="phase" aria-label="Phase for ${attr(item.name)}">
                      <input maxlength="48" value="${attr(item.gate)}" data-action="timeline-field" data-id="${attr(item.id)}" data-field="gate" aria-label="Gate for ${attr(item.name)}">
                    </div>
                    ${item.override ? "<small>Current date override</small>" : ""}
                  </td>
                  <td><input maxlength="40" value="${attr(item.ownerRole)}" data-action="timeline-field" data-id="${attr(item.id)}" data-field="ownerRole" aria-label="Owner for ${attr(item.name)}"></td>
                  <td><select aria-label="Status for ${attr(item.name)}" data-action="timeline-field" data-id="${attr(item.id)}" data-field="status">${optionList(statusOptions, item.status)}</select></td>
                  <td><select aria-label="Dependency for ${attr(item.name)}" data-action="timeline-field" data-id="${attr(item.id)}" data-field="dependency"><option value="">None</option>${estimate.timelineItems.filter((candidate) => candidate.id !== item.id).map((candidate) => `<option value="${attr(candidate.id)}"${selected(candidate.id, item.dependencies[0] || "")}>${escapeHtml(candidate.name)}</option>`).join("")}</select>${item.dependencies.length > 1 ? `<small>+${item.dependencies.length - 1} additional seeded dependency</small>` : ""}</td>
                  <td><span>${formatDate(item.baselineStart, true)}</span><small>to ${formatDate(item.baselineFinish, true)}</small></td>
                  <td><input type="date" aria-label="Current start for ${attr(item.name)}" value="${attr(item.currentStart)}" data-action="timeline-field" data-id="${attr(item.id)}" data-field="currentStart"></td>
                  <td><input type="date" aria-label="Current finish for ${attr(item.name)}" value="${attr(item.currentFinish)}" data-action="timeline-field" data-id="${attr(item.id)}" data-field="currentFinish"></td>
                  <td><span class="variance ${variance > 0 ? "late" : variance < 0 ? "early" : ""}">${variance > 0 ? "+" : ""}${variance}d</span></td>
                  <td><div class="row-controls"><label title="Critical task"><input type="checkbox" data-action="timeline-critical" data-id="${attr(item.id)}"${checked(item.critical)}><span class="sr-only">Critical task</span></label><button data-action="move-task" data-id="${attr(item.id)}" data-direction="-1" title="Move up">↑</button><button data-action="move-task" data-id="${attr(item.id)}" data-direction="1" title="Move down">↓</button><button data-action="delete-task" data-id="${attr(item.id)}" title="Delete task">${icon("trash")}<span class="sr-only">Delete ${escapeHtml(item.name)}</span></button></div></td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
        <div class="gantt-scroll">
        <div class="gantt-panel" aria-label="Accessible schedule chart" style="width:${chartWidth};--grid-size:${gridSize}">
          <div class="gantt-scale"><span>${formatDate(min, true)}</span><span>${formatDate(C.addDays(min, Math.round(span / 2)), true)}</span><span>${formatDate(max, true)}</span></div>
          <div class="gantt-rows">
            ${rows.map((item) => {
              const left = Math.max(0, (C.diffDays(min, item.currentStart) / span) * 100);
              const width = item.type === "milestone" ? 0 : Math.max(1.8, (Math.max(1, C.diffDays(item.currentStart, item.currentFinish)) / span) * 100);
              return `<div class="gantt-row" title="${attr(item.name)}: ${attr(item.currentStart)} to ${attr(item.currentFinish)}">
                <span class="${item.type === "milestone" ? "gantt-milestone" : "gantt-bar"} ${item.critical ? "critical" : ""}" style="left:${left}%;width:${width}%"></span>
                <span class="sr-only">${escapeHtml(item.name)}, ${formatDate(item.currentStart)} to ${formatDate(item.currentFinish)}</span>
              </div>`;
            }).join("")}
          </div>
        </div>
        </div>
      </section>
    `;
  }

  function renderDeliverables(estimate) {
    const filter = ui.filters.deliverables;
    const items = estimate.deliverables.filter((item) => filter === "All" || item.applicability === filter || item.status === filter);
    const required = estimate.deliverables.filter((item) => item.applicability === "Required");
    const verified = required.filter((item) => item.reviewStatus === "Verified" || item.status === "Verified").length;
    return `
      ${pageHead(
        "Slide and deliverable tracker",
        "Is the review package complete and reviewable?",
        "Seeded from the Investment slide library on Slide 38 and mandatory review tables on Slide 37.",
        `<button class="button button-primary" data-action="open-add-deliverable">${icon("plus")} Add deliverable</button>`,
      )}
      <section class="source-ribbon" aria-label="Source alignment">
        <div>${icon("shield")}<span><strong>Deck-aligned controls</strong><small>Slide 38 investment library plus Slide 37 mandatory tables</small></span></div>
        <b>January 2026</b>
      </section>
      <section class="metric-strip">
        <div><span>Required</span><strong>${required.length}</strong></div>
        <div><span>Verified</span><strong>${verified}</strong></div>
        <div><span>Awaiting review</span><strong>${required.filter((item) => item.status === "Ready for Review" && item.reviewStatus !== "Verified").length}</strong></div>
        <div><span>Blocked</span><strong>${required.filter((item) => item.status === "Blocked").length}</strong></div>
      </section>
      <section class="toolbar">
        <label>Show <select data-action="deliverable-filter">${optionList(["All", ...applicabilityOptions, ...deliverableStatuses], filter)}</select></label>
        <div class="bulk-action">
          <select id="bulk-deliverable-status" aria-label="Bulk deliverable status">${optionList(deliverableStatuses, "Draft")}</select>
          <button class="button button-small" data-action="bulk-deliverables">Set visible</button>
        </div>
      </section>
      <section class="table-wrap">
        <table class="data-table deliverable-table">
          <thead><tr><th>Deliverable</th><th>Applicability</th><th>Status</th><th>Slide #</th><th>Gate due</th><th>Review</th></tr></thead>
          <tbody>
            ${items.map((item) => `<tr class="${item.critical ? "critical-row" : ""}">
              <td><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.category)}${item.critical ? " • Critical" : ""}</small></td>
              <td><select data-action="deliverable-field" data-id="${attr(item.id)}" data-field="applicability" aria-label="Applicability for ${attr(item.name)}">${optionList(applicabilityOptions, item.applicability)}</select></td>
              <td><select data-action="deliverable-field" data-id="${attr(item.id)}" data-field="status" aria-label="Status for ${attr(item.name)}" ${item.applicability === "Not Applicable" ? "disabled" : ""}>${optionList(deliverableStatuses, item.status)}</select></td>
              <td><input class="slide-ref" inputmode="numeric" maxlength="12" value="${attr(item.slideReference)}" placeholder="e.g., 4-5" data-action="deliverable-field" data-id="${attr(item.id)}" data-field="slideReference" aria-label="Slide reference for ${attr(item.name)}"></td>
              <td><input maxlength="48" value="${attr(item.gateDue)}" data-action="deliverable-field" data-id="${attr(item.id)}" data-field="gateDue" aria-label="Gate due for ${attr(item.name)}"></td>
              <td><select data-action="deliverable-field" data-id="${attr(item.id)}" data-field="reviewStatus" aria-label="Review status for ${attr(item.name)}" ${item.applicability === "Not Applicable" ? "disabled" : ""}>${optionList(["Not Started", "Ready for Review", "Verified", "Returned for Action"], item.reviewStatus)}</select></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </section>
    `;
  }

  function renderChecklist(estimate) {
    const isMidstream = ui.checklistMode === "midstream";
    const filter = ui.filters.checklist;
    const sourceItems = isMidstream ? estimate.midstreamItems : estimate.reviewItems;
    const items = sourceItems.filter((item) => {
      if (filter === "All") return true;
      if (filter === "Critical") return item.critical;
      if (filter === "Needs Analyst") return isMidstream ? ["Not Started", "In Progress", "Blocked"].includes(item.status) : Object.values(item.artifactStatuses).some((value) => ["Not Started", "In Progress", "Returned for Action"].includes(value));
      if (filter === "Needs SME") return isMidstream ? item.status === "Ready for Review" : Object.values(item.artifactStatuses).some((value) => ["Implemented", "Analyst Checked"].includes(value));
      if (filter === "Returned") return isMidstream ? item.status === "Blocked" : Object.values(item.artifactStatuses).includes("Returned for Action");
      return true;
    });
    const groups = [...new Set(items.map((item) => item.category))];
    return `
      ${pageHead(
        "Review control",
        isMidstream ? "Midstream readiness" : "Artifact-level SME checklist",
        isMidstream ? "Track whether inputs, methods, and schedule readiness are on the right path without storing program details." : "Track incorporation and verification separately in PowerPoint, ACE, and Excel/POST.",
        isMidstream ? "" : `<button class="button button-primary" data-action="open-add-review">${icon("plus")} Add review rule</button>`,
      )}
      <section class="source-ribbon" aria-label="Source alignment">
        <div>${icon("shield")}<span><strong>${isMidstream ? "Midstream engagement controls" : "SME final-review controls"}</strong><small>${isMidstream ? "Aligned to Slides 29–32" : "Aligned to Slide 37 with time-sensitive manager confirmations"}</small></span></div>
        <b>January 2026</b>
      </section>
      <div class="segmented" role="tablist" aria-label="Checklist type">
        <button role="tab" aria-selected="${isMidstream}" class="${isMidstream ? "active" : ""}" data-action="checklist-mode" data-mode="midstream">Midstream readiness</button>
        <button role="tab" aria-selected="${!isMidstream}" class="${!isMidstream ? "active" : ""}" data-action="checklist-mode" data-mode="final">Slide 37 SME checklist</button>
      </div>
      <section class="toolbar">
        <label>Show <select data-action="checklist-filter">${optionList(["All", "Needs Analyst", "Needs SME", "Returned", "Critical"], filter)}</select></label>
        <span class="toolbar-note">${items.length} of ${sourceItems.length} items • ${isMidstream ? "Readiness statuses" : "January 2026 seed library"}</span>
      </section>
      <section class="checklist-groups">
        ${groups.map((group) => `
          <article class="checklist-group">
            <div class="group-head"><h2>${escapeHtml(group)}</h2><span>${items.filter((item) => item.category === group).length} checks</span></div>
            ${isMidstream ? `
              <div class="checklist-cards">
                ${items.filter((item) => item.category === group).map((item) => `<div class="checklist-card ${item.critical ? "critical" : ""}">
                  <div><strong>${escapeHtml(item.requirement)}</strong><small>${item.critical ? "Critical" : "Standard"} • Due ${escapeHtml(item.gateDue)}</small></div>
                  <select data-action="midstream-field" data-id="${attr(item.id)}" data-field="status" aria-label="Status for ${attr(item.requirement)}">${optionList(["Not Started", "In Progress", "Ready for Review", "Complete", "Blocked", "Not Applicable"], item.status)}</select>
                </div>`).join("")}
              </div>
            ` : `
              <div class="table-wrap">
                <table class="data-table review-table">
                  <thead><tr><th>Requirement</th>${C.REVIEW_ARTIFACTS.map((artifact) => `<th>${escapeHtml(artifact)}</th>`).join("")}<th>Review</th><th>Control</th></tr></thead>
                  <tbody>
                    ${items.filter((item) => item.category === group).map((item) => `<tr class="${item.critical ? "critical-row" : ""}">
                      <td><strong>${escapeHtml(item.requirement)}</strong><small>${item.critical ? "Critical" : "Standard"} • ${escapeHtml(item.sourceVersion)}</small></td>
                      ${C.REVIEW_ARTIFACTS.map((artifact) => `<td><select data-action="review-artifact" data-id="${attr(item.id)}" data-artifact="${attr(artifact)}" aria-label="${attr(artifact)} status for ${attr(item.requirement)}">${optionList(artifactStatuses, item.artifactStatuses[artifact])}</select></td>`).join("")}
                      <td><select data-action="review-field" data-id="${attr(item.id)}" data-field="reviewStatus" aria-label="Overall review status for ${attr(item.requirement)}">${optionList(["Not Started", "In Progress", "Ready for Review", "SME Verified", "Returned for Action"], item.reviewStatus)}</select></td>
                      <td><div class="review-controls">${item.managerConfirmation ? `<label class="confirm-check"><input type="checkbox" data-action="review-check" data-id="${attr(item.id)}" data-field="managerConfirmed"${checked(item.managerConfirmed)}> Manager confirmed</label>` : '<span class="control-ok">Current seed</span>'}<button class="text-button danger-text" data-action="retire-review" data-id="${attr(item.id)}">${item.retired ? "Retired" : "Retire"}</button></div></td>
                    </tr>`).join("")}
                  </tbody>
                </table>
              </div>
            `}
          </article>
        `).join("")}
      </section>
    `;
  }

  function renderIssues(estimate) {
    const filter = ui.filters.issues;
    const items = estimate.issues.filter((item) => filter === "All" || (filter === "Open" ? !["Closed", "Accepted"].includes(item.status) : item.severity === filter));
    const counts = {
      Blocker: estimate.issues.filter((item) => !["Closed", "Accepted"].includes(item.status) && item.severity === "Blocker").length,
      High: estimate.issues.filter((item) => !["Closed", "Accepted"].includes(item.status) && item.severity === "High").length,
      Medium: estimate.issues.filter((item) => !["Closed", "Accepted"].includes(item.status) && item.severity === "Medium").length,
      Overdue: estimate.issues.filter((item) => !["Closed", "Accepted"].includes(item.status) && item.dueDate < C.todayIso()).length,
    };
    return `
      ${pageHead(
        "Issues and actions",
        "Review findings without programmatic detail",
        "Use structured categories and a short sanitized summary. Closing an issue does not verify its linked item.",
        `<button class="button button-primary" data-action="open-add-issue">${icon("plus")} Add issue</button>`,
      )}
      <section class="metric-strip issues">
        ${Object.entries(counts).map(([key, value]) => `<div><span>${escapeHtml(key)}</span><strong>${value}</strong></div>`).join("")}
      </section>
      <section class="toolbar">
        <label>Show <select data-action="issue-filter">${optionList(["Open", "All", "Blocker", "High", "Medium", "Low"], filter)}</select></label>
        <span class="toolbar-note">${items.length} visible issue${items.length === 1 ? "" : "s"}</span>
      </section>
      ${items.length ? `<section class="issue-board">
        ${items.map((issue) => `<article class="issue-card severity-${issue.severity.toLowerCase()}">
          <div class="issue-card-head"><span class="severity">${escapeHtml(issue.severity)}</span><select data-action="issue-field" data-id="${attr(issue.id)}" data-field="status" aria-label="Status for ${attr(issue.category)}">${optionList(issueStatuses, issue.status)}</select></div>
          <h2>${escapeHtml(issue.category)}</h2>
          <p>${escapeHtml(issue.sanitizedSummary || "No optional summary entered.")}</p>
          <dl><div><dt>Owner</dt><dd>${escapeHtml(issue.ownerRole)}</dd></div><div><dt>Due</dt><dd class="${issue.dueDate < C.todayIso() && !["Closed", "Accepted"].includes(issue.status) ? "overdue" : ""}">${formatDate(issue.dueDate)}</dd></div><div><dt>Linked to</dt><dd>${escapeHtml(issue.linkedArtifactType || "Estimate")}</dd></div></dl>
          <div class="issue-foot">${issue.blocksNextGate ? '<span class="blocker-flag">Blocks next gate</span>' : "<span>Not a gate blocker</span>"}<button class="text-button danger-text" data-action="delete-issue" data-id="${attr(issue.id)}">Delete</button></div>
        </article>`).join("")}
      </section>` : `<section class="empty-state compact"><span class="empty-orbit">${icon("check")}</span><h2>No issues match this view</h2><p>Add a structured issue when a review finding or action needs tracking.</p></section>`}
    `;
  }

  function renderSettings(estimate) {
    return `
      ${pageHead("Estimate and workspace settings", "Configuration control and local data", "Changes are saved in this browser only.")}
      <section class="settings-grid">
        <article class="panel">
          <div class="panel-head"><div><p class="eyebrow">Estimate identity</p><h2>Sanitized record</h2></div></div>
          <div class="form-grid">

  function field(label, control, help = "") {
    return `<label class="form-field"><span>${escapeHtml(label)}</span>${control}${help ? `<small>${escapeHtml(help)}</small>` : ""}</label>`;
  }

  function renderModal() {
    if (!workspace.preferences.acknowledged) return renderAcknowledgement();
    if (!ui.modal) return "";
    if (ui.modal === "wizard") return renderWizard();
    if (ui.modal === "add-task") return renderAddTask();
    if (ui.modal === "add-deliverable") return renderAddDeliverable();
    if (ui.modal === "add-review") return renderAddReview();
    if (ui.modal === "add-issue") return renderAddIssue();
    if (ui.modal === "help") return renderHelp();
    if (ui.modal === "tour") return renderTour();
    if (ui.modal === "mobile-menu") return renderMobileMenu();
    if (ui.modal === "import-preview") return renderImportPreview();
    return "";
  }

      <div class="modal-head"><div><p class="eyebrow">${escapeHtml(eyebrow)}</p><h2 id="modal-title">${escapeHtml(title)}</h2></div>${lock ? "" : `<button class="icon-button" data-action="close-modal">${icon("close")}<span class="sr-only">Close</span></button>`}</div>
      <div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ""}

      const first = schedule[0];
