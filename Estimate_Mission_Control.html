  function captureWizardStep() {
    const w = ui.wizard;
    if (ui.wizardStep === 1) {
      const ack = document.getElementById("wizard-ack");
      if (!ack?.checked) return { ok: false, message: "Confirm the data-handling acknowledgement to continue." };
      w.acknowledged = true;
    } else if (ui.wizardStep === 2) {
      w.sanitizedAlias = document.getElementById("wiz-alias")?.value.trim() || "";
      w.analystAlias = document.getElementById("wiz-analyst")?.value.trim() || "";
      w.templateId = document.getElementById("wiz-template")?.value || "sbe";
      w.productType = C.resolveTemplate(w.templateId).name;
      w.productStatus = document.getElementById("wiz-status")?.value || "New";
      if (!w.sanitizedAlias) return { ok: false, message: "Enter a sanitized estimate alias." };
      if (warningPattern.test(`${w.sanitizedAlias} ${w.analystAlias}`)) return { ok: false, message: "The alias fields may contain sensitive or prohibited detail. Use generic aliases only." };
      const template = C.resolveTemplate(w.templateId);
      if (!template.tasks.some((row) => row[0] === w.anchorEvent)) w.anchorEvent = template.defaultAnchorKey;
    } else if (ui.wizardStep === 3) {
      w.purposeCategory = document.getElementById("wiz-purpose")?.value;
      w.scopeCategory = document.getElementById("wiz-scope")?.value;
      w.estimatePhase = document.getElementById("wiz-phase")?.value;
      w.costPhaseFlags = {
        rdte: document.getElementById("wiz-rdte")?.checked,
        procurement: document.getElementById("wiz-proc")?.checked,
        os: document.getElementById("wiz-os")?.checked,
      };
      if (!Object.values(w.costPhaseFlags).some(Boolean)) return { ok: false, message: "Select at least one applicable cost phase." };
    } else if (ui.wizardStep === 4) {
      w.anchorEvent = document.getElementById("wiz-anchor")?.value;
      w.anchorDate = document.getElementById("wiz-date")?.value;
      w.calendarMode = document.getElementById("wiz-calendar")?.value;
      if (!C.parseDate(w.anchorDate)) return { ok: false, message: "Enter a valid anchor date." };
    }
    return { ok: true };
  }

  function checkSafeText(value, fieldName = "Text") {
    if (warningPattern.test(value)) {
      toast(`${fieldName} may contain prohibited detail. Use generic workflow wording.`, "danger");
      return false;
    }
    return true;
  }

  function downloadJson(filename, value) {
    const blob = new Blob([JSON.stringify(value, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  async function handleClick(event) {
    const button = event.target.closest("[data-action]");
    if (!button) return;
    const action = button.dataset.action;
    const estimate = selectedEstimate();

    if (action === "nav") {
      ui.view = button.dataset.view;
      ui.modal = "";
      render();
      document.getElementById("main-content")?.focus();
    } else if (action === "go-portfolio") {
      ui.view = "portfolio";
      render();
    } else if (action === "open-estimate") {
      ui.selectedEstimateId = button.dataset.id;
      ui.view = "dashboard";
      render();
    } else if (action === "open-wizard") {
      ui.wizardStep = 1;
      ui.wizard = defaultWizard();
      setModal("wizard");
    } else if (action === "close-modal") {
      closeModal();
    } else if (action === "wizard-next") {
      const result = captureWizardStep();
      if (!result.ok) return toast(result.message, "danger");
      ui.wizardStep += 1;
      render();
    } else if (action === "wizard-back") {
      captureWizardStep();
      ui.wizardStep -= 1;
      render();
    } else if (action === "wizard-create") {
      const result = captureWizardStep();
      if (!result.ok) return toast(result.message, "danger");
      const estimateNew = C.newEstimate({
        ...ui.wizard,
        blackoutDates: workspace.preferences.blackoutDates,
      });
      workspace.estimates.push(estimateNew);
      ui.selectedEstimateId = estimateNew.id;
      ui.view = "dashboard";
      ui.modal = "";
      queueSave("Estimate created and saved locally.");
      render();
    } else if (action === "ack-start" || action === "ack-demo") {
      if (!document.getElementById("ack-checkbox")?.checked) return toast("Check the acknowledgement before continuing.", "danger");
      if (action === "ack-demo") workspace = C.createDemoWorkspace();
      else workspace.preferences.acknowledged = true;
      ui.selectedEstimateId = workspace.estimates[0]?.id || "";
      ui.view = workspace.estimates.length ? "dashboard" : "portfolio";
      queueSave("Acknowledgement saved.");
      render();
    } else if (action === "load-demo") {
      if (workspace.estimates.length && !root.confirm("Replace current local workspace with the fictional demo? A recovery snapshot will be saved.")) return;
      await dbPut("recovery", workspace);
      workspace = C.createDemoWorkspace();
      ui.selectedEstimateId = workspace.estimates[0].id;
      ui.view = "dashboard";
      queueSave("Fictional demo loaded.");
      render();
    } else if (action === "open-help") {
      setModal("help");
    } else if (action === "start-tour") {
      if (!workspace.estimates.length) {
        workspace = C.createDemoWorkspace();
        ui.selectedEstimateId = workspace.estimates[0].id;
        queueSave("Fictional demo loaded for the walkthrough.");
      }
      ui.tourStep = 0;
      ui.view = tourSteps[0].view;
      setModal("tour");
    } else if (action === "tour-next") {
      ui.tourStep = Math.min(tourSteps.length - 1, ui.tourStep + 1);
      ui.view = tourSteps[ui.tourStep].view;
      render();
    } else if (action === "tour-back") {
      ui.tourStep = Math.max(0, ui.tourStep - 1);
      ui.view = tourSteps[ui.tourStep].view;
      render();
    } else if (action === "tour-finish" || action === "tour-exit") {
      ui.modal = "";
      ui.view = "dashboard";
      render();
    } else if (action === "open-mobile-menu") {
      setModal("mobile-menu");
    } else if (action === "open-add-task") {
      setModal("add-task");
    } else if (action === "open-add-deliverable") {
      setModal("add-deliverable");
    } else if (action === "open-add-review") {
      setModal("add-review");
    } else if (action === "open-add-issue") {
      setModal("add-issue");
    } else if (action === "save-task" && estimate) {
      const form = document.getElementById("add-task-form");
      const data = Object.fromEntries(new FormData(form));
      if (!data.name || !checkSafeText(data.name, "Task name")) return;
      if (data.currentFinish < data.currentStart) return toast("Finish date cannot be before the start date.", "danger");
      const previous = estimate.timelineItems.at(-1);
      const item = {
        id: C.uid("task"),
        templateKey: "",
        name: data.name,
        phase: data.phase || "Custom",
        gate: data.gate || "Custom Review",
        type: data.type,
        ownerRole: data.ownerRole || "Analyst",
        baselineStart: data.currentStart,
        baselineFinish: data.currentFinish,
        currentStart: data.currentStart,
        currentFinish: data.currentFinish,
        duration: C.diffDays(data.currentStart, data.currentFinish, estimate.calendarMode, workspace.preferences.blackoutDates),
        dependencies: data.dependency ? [data.dependency] : previous ? [previous.id] : [],
        critical: data.critical === "on",
        optional: data.critical !== "on",
        status: "Not Started",
        weight: data.critical === "on" ? 3 : 1,
        override: true,
      };
      estimate.timelineItems.push(item);
      touchEstimate(estimate, "Custom schedule item added");
      closeModal();
    } else if (action === "save-deliverable" && estimate) {
      const data = Object.fromEntries(new FormData(document.getElementById("add-deliverable-form")));
      if (!data.name || !checkSafeText(data.name, "Deliverable name")) return;
      estimate.deliverables.push({
        id: C.uid("del"),
        templateKey: "",
        name: data.name,
        category: data.category || "Custom",
        applicability: data.applicability,
        status: "Not Started",
        slideReference: "",
        gateDue: data.gateDue || "SME Review",
        ownerRole: data.ownerRole || "Analyst",
        reviewStatus: "Not Started",
        verifiedDate: "",
        critical: data.critical === "on",
        linkedIssueIds: [],
      });
      touchEstimate(estimate, "Custom deliverable added");
      closeModal();
    } else if (action === "save-review" && estimate) {
      const data = Object.fromEntries(new FormData(document.getElementById("add-review-form")));
      if (!data.requirement || !checkSafeText(data.requirement, "Review requirement")) return;
      const targets = C.REVIEW_ARTIFACTS.filter((artifact) => data[artifact] === "on");
      if (!targets.length) return toast("Select at least one artifact target.", "danger");
      const artifactStatusMap = {};
      C.REVIEW_ARTIFACTS.forEach((artifact) => {
        artifactStatusMap[artifact] = targets.includes(artifact) ? "Not Started" : "Not Applicable";
      });
      estimate.reviewItems.push({
        id: C.uid("review"),
        libraryItemId: C.uid("custom-rule"),
        category: data.category || "Custom Review Rule",
        requirement: data.requirement,
        sourceVersion: "Local custom rule",
        effectiveCycle: data.effectiveCycle || "Current",
        critical: data.critical === "on",
        managerConfirmation: data.managerConfirmation === "on",
        managerConfirmed: data.managerConfirmation !== "on",
        applicability: "Required",
        gateDue: data.gateDue || "SME Review",
        artifactTargets: targets,
        artifactStatuses: artifactStatusMap,
        reviewStatus: "Not Started",
        verifiedByRole: "",
        verifiedDate: "",
        linkedIssueIds: [],
        retired: false,
      });
      touchEstimate(estimate, "Custom review rule added");
      closeModal();
    } else if (action === "save-issue" && estimate) {
      const data = Object.fromEntries(new FormData(document.getElementById("add-issue-form")));
      if (!checkSafeText(data.sanitizedSummary || "", "Issue summary")) return;
      const now = new Date().toISOString();
      estimate.issues.push({
        id: C.uid("issue"),
        category: data.category,
        linkedArtifactType: data.linkedArtifactType,
        linkedArtifactId: "",
        severity: data.severity,
        ownerRole: data.ownerRole || "Analyst",
        openedDate: C.todayIso(),
        dueDate: data.dueDate,
        status: "Open",
        resolutionDisposition: "",
        sanitizedSummary: data.sanitizedSummary || "",
        blocksNextGate: data.blocksNextGate === "on" || data.severity === "Blocker",
        createdAt: now,
        updatedAt: now,
      });
      touchEstimate(estimate, "Review issue added");
      closeModal();
    } else if (action === "delete-issue" && estimate) {
      if (!root.confirm("Delete this issue?")) return;
      estimate.issues = estimate.issues.filter((item) => item.id !== button.dataset.id);
      touchEstimate(estimate, "Issue deleted");
      render();
    } else if (action === "move-task" && estimate) {
      const index = estimate.timelineItems.findIndex((item) => item.id === button.dataset.id);
      const nextIndex = index + Number(button.dataset.direction);
      if (index < 0 || nextIndex < 0 || nextIndex >= estimate.timelineItems.length) return;
      const [item] = estimate.timelineItems.splice(index, 1);
      estimate.timelineItems.splice(nextIndex, 0, item);
      touchEstimate(estimate, "Schedule item reordered");
      render();
    } else if (action === "delete-task" && estimate) {
      const item = estimate.timelineItems.find((entry) => entry.id === button.dataset.id);
      if (!item || !root.confirm(`Delete “${item.name}” from this schedule?`)) return;
      estimate.timelineItems = estimate.timelineItems.filter((entry) => entry.id !== item.id);
      estimate.timelineItems.forEach((entry) => {
        entry.dependencies = entry.dependencies.filter((dependency) => dependency !== item.id);
      });
      touchEstimate(estimate, "Schedule item deleted");
      render();
    } else if (action === "retire-review" && estimate) {
      const item = estimate.reviewItems.find((entry) => entry.id === button.dataset.id);
      if (!item) return;
      item.retired = !item.retired;
      item.applicability = item.retired ? "Not Applicable" : "Required";
      touchEstimate(estimate, item.retired ? "Review rule retired" : "Review rule restored");
      render();
    } else if (action === "bulk-deliverables" && estimate) {
      const value = document.getElementById("bulk-deliverable-status")?.value;
      const filter = ui.filters.deliverables;
      estimate.deliverables.forEach((item) => {
        if ((filter === "All" || item.applicability === filter || item.status === filter) && item.applicability !== "Not Applicable") item.status = value;
      });
      touchEstimate(estimate, "Visible deliverable statuses updated");
      render();
    } else if (action === "checklist-mode") {
      ui.checklistMode = button.dataset.mode;
      render();
    } else if (action === "timeline-view-reset") {
      ui.timelineView = { start: "", end: "", scale: "fit" };
      render();
    } else if (action === "baseline-reset" && estimate) {
      if (!root.confirm("Restore all current schedule dates to the baseline? Status values will be preserved.")) return;
      estimate.timelineItems.forEach((item) => {
        item.currentStart = item.baselineStart;
        item.currentFinish = item.baselineFinish;
        item.override = false;
      });
      touchEstimate(estimate, "Current schedule restored to baseline");
      render();
    } else if (action === "edit-estimate") {
      ui.view = "settings";
      render();
    } else if (action === "export-workspace") {
      downloadJson(`Estimate_Mission_Control_Workspace_${C.todayIso()}.json`, workspace);
      toast("Workspace export prepared.");
    } else if (action === "export-estimate" && estimate) {
      downloadJson(`${estimate.sanitizedAlias.replace(/[^a-z0-9]+/gi, "_")}_Status_${C.todayIso()}.json`, {
        schemaVersion: C.SCHEMA_VERSION,
        appVersion: C.APP_VERSION,
        preferences: workspace.preferences,
        checklistLibraries: workspace.checklistLibraries,
        scheduleTemplates: workspace.scheduleTemplates,
        estimates: [estimate],
        updatedAt: new Date().toISOString(),
      });
      toast("Estimate export prepared.");
    } else if (action === "trigger-import") {
      document.getElementById("import-file")?.click();
    } else if (action === "import-merge" || action === "import-replace") {
      if (!ui.importCandidate) return;
      await dbPut("recovery", workspace);
      if (action === "import-replace") {
        workspace = ui.importCandidate;
      } else {
        const existing = new Set(workspace.estimates.map((item) => item.id));
        const additions = ui.importCandidate.estimates.filter((item) => !existing.has(item.id));
        workspace.estimates.push(...additions);
      }
      workspace.preferences.acknowledged = true;
      ui.selectedEstimateId = workspace.estimates[0]?.id || "";
      ui.modal = "";
      queueSave("Import completed. Recovery snapshot saved.");
      render();
    } else if (action === "delete-all") {
      if (!root.confirm("Delete all local estimate data from this browser? Export a backup first if needed.")) return;
      await dbPut("recovery", workspace);
      await dbDelete(WORKSPACE_KEY);
      workspace = C.createWorkspace();
      workspace.preferences.acknowledged = true;
      ui.selectedEstimateId = "";
      ui.view = "portfolio";
      queueSave("Local estimate data deleted. A recovery snapshot was retained.");
      render();
    } else if (action === "print") {
      root.print();
    }
  }

  function handleChange(event) {
    const target = event.target;
    const action = target.dataset.action;
    const estimate = selectedEstimate();
    if (action === "select-estimate") {
      ui.selectedEstimateId = target.value;
      if (ui.view === "portfolio") ui.view = "dashboard";
      render();
    } else if (action === "timeline-filter") {
      ui.filters.timeline = target.value;
      render();
    } else if (action === "timeline-scale") {
      ui.timelineView.scale = target.value;
      render();
    } else if (action === "timeline-start" || action === "timeline-end") {
      const field = action === "timeline-start" ? "start" : "end";
      const previous = ui.timelineView[field];
      ui.timelineView[field] = target.value;
      const start = ui.timelineView.start;
      const end = ui.timelineView.end;
      if ((target.value && !C.parseDate(target.value)) || (start && end && end <= start)) {
        ui.timelineView[field] = previous;
        return toast("Chart end must be after chart start.", "danger");
      }
      render();
    } else if (action === "deliverable-filter") {
      ui.filters.deliverables = target.value;
      render();
    } else if (action === "checklist-filter") {
      ui.filters.checklist = target.value;
      render();
    } else if (action === "issue-filter") {
      ui.filters.issues = target.value;
      render();
    } else if (action === "timeline-field" && estimate) {
      const item = estimate.timelineItems.find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      const field = target.dataset.field;
      if (["name", "phase", "gate", "ownerRole"].includes(field) && !checkSafeText(target.value, "Schedule field")) {
        target.value = item[field];
        return;
      }
      if (field === "dependency") {
        const previousDependencies = [...item.dependencies];
        item.dependencies = target.value ? [target.value] : [];
        if (C.validateTimeline(estimate.timelineItems).some((error) => error.type === "cycle")) {
          item.dependencies = previousDependencies;
          target.value = previousDependencies[0] || "";
          return toast("That dependency would create a cycle.", "danger");
        }
        touchEstimate(estimate, "Schedule dependency updated");
        render();
        return;
      }
      const old = item[field];
      item[field] = target.value;
      if (field === "currentStart" || field === "currentFinish") {
        if (!C.parseDate(target.value)) {
          item[field] = old;
          return toast("Enter a valid date.", "danger");
        }
        if (item.currentFinish < item.currentStart) {
          item[field] = old;
          return toast("Finish date cannot be before start date.", "danger");
        }
        item.override = true;
        item.duration = C.diffDays(item.currentStart, item.currentFinish, estimate.calendarMode, workspace.preferences.blackoutDates);
        const delta = C.diffDays(old, target.value, estimate.calendarMode, workspace.preferences.blackoutDates);
        if (delta && root.confirm("Cascade this date change to directly dependent tasks?")) {
          cascadeDependents(estimate, item.id, delta, new Set());
        }
      }
      touchEstimate(estimate, "Timeline updated");
      render();
    } else if (action === "timeline-critical" && estimate) {
      const item = estimate.timelineItems.find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      item.critical = target.checked;
      item.optional = !target.checked;
      item.weight = target.checked ? 3 : 1;
      touchEstimate(estimate, "Schedule criticality updated");
      render();
    } else if (action === "deliverable-field" && estimate) {
      const item = estimate.deliverables.find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      const field = target.dataset.field;
      if (field === "slideReference" && target.value && !/^\d{1,3}(?:\s*[-,]\s*\d{1,3})*$/.test(target.value)) {
        target.value = item.slideReference;
        return toast("Use only a slide number or numeric range, such as 4-5.", "danger");
      }
      if (["name", "gateDue"].includes(field) && !checkSafeText(target.value, "Deliverable field")) {
        target.value = item[field];
        return;
      }
      item[field] = target.value;
      if (field === "applicability" && target.value === "Not Applicable") {
        item.status = "Not Started";
        item.reviewStatus = "Not Started";
      }
      touchEstimate(estimate, "Deliverable tracker updated");
      render();
    } else if (action === "midstream-field" && estimate) {
      const item = estimate.midstreamItems.find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      item[target.dataset.field] = target.value;
      touchEstimate(estimate, "Midstream readiness updated");
      render();
    } else if (action === "review-artifact" && estimate) {
      const item = estimate.reviewItems.find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      item.artifactStatuses[target.dataset.artifact] = target.value;
      if (target.value === "SME Verified") item.verifiedDate = C.todayIso();
      touchEstimate(estimate, "Artifact review status updated");
      render();
    } else if (action === "review-field" && estimate) {
      const item = estimate.reviewItems.find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      item[target.dataset.field] = target.value;
      if (target.value === "SME Verified") item.verifiedDate = C.todayIso();
      touchEstimate(estimate, "SME review status updated");
      render();
    } else if (action === "review-check" && estimate) {
      const item = estimate.reviewItems.find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      item[target.dataset.field] = target.checked;
      touchEstimate(estimate, "Time-sensitive rule confirmation updated");
      render();
    } else if (action === "issue-field" && estimate) {
      const item = estimate.issues.find((entry) => entry.id === target.dataset.id);
      if (!item) return;
      item[target.dataset.field] = target.value;
      item.updatedAt = new Date().toISOString();
      touchEstimate(estimate, "Issue status updated");
      render();
    } else if (action === "estimate-field" && estimate) {
      if (["sanitizedAlias", "analystAlias"].includes(target.dataset.field) && !checkSafeText(target.value, "Estimate identity")) {
        target.value = estimate[target.dataset.field];
        return;
      }
      estimate[target.dataset.field] = target.value;
      touchEstimate(estimate, "Estimate settings updated");
      render();
    } else if (action === "artifact-version" && estimate) {
      estimate.artifactVersions[target.dataset.artifact] = target.value;
      estimate.artifactVersions.aligned = new Set(C.REVIEW_ARTIFACTS.map((key) => estimate.artifactVersions[key])).size === 1;
      touchEstimate(estimate, "Artifact version updated");
      render();
    } else if (action === "artifact-aligned" && estimate) {
      estimate.artifactVersions.aligned = target.checked;
      touchEstimate(estimate, "Package alignment updated");
      render();
    } else if (action === "preference") {
      const value = target.dataset.field === "warningDays" ? Number(target.value) : target.value;
      workspace.preferences[target.dataset.field] = value;
      queueSave("Workspace preference saved.");
      render();
    } else if (action === "blackout-dates") {
      const dates = target.value.split(",").map((value) => value.trim()).filter(Boolean);
      if (dates.some((value) => !C.parseDate(value))) return toast("Use comma-separated dates in YYYY-MM-DD format.", "danger");
      workspace.preferences.blackoutDates = dates;
      queueSave("Blackout dates saved.");
      render();
    } else if (action === "import-file") {
      const file = target.files?.[0];
      if (!file) return;
      if (!/\.json$/i.test(file.name) || file.size > 10 * 1024 * 1024) {
        target.value = "";
        return toast("Choose a JSON file smaller than 10 MB.", "danger");
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          ui.importCandidate = JSON.parse(reader.result);
        } catch {
          ui.importCandidate = { invalid: true };
        }
        ui.modal = "import-preview";
        render();
      };
      reader.readAsText(file);
      target.value = "";
    }
  }

  function cascadeDependents(estimate, parentId, delta, visited) {
    if (visited.has(parentId)) return;
    visited.add(parentId);
    estimate.timelineItems
      .filter((item) => item.dependencies.includes(parentId))
      .forEach((item) => {
        item.currentStart = C.addDays(item.currentStart, delta, estimate.calendarMode, workspace.preferences.blackoutDates);
        item.currentFinish = C.addDays(item.currentFinish, delta, estimate.calendarMode, workspace.preferences.blackoutDates);
        item.override = true;
        cascadeDependents(estimate, item.id, delta, visited);
      });
  }

  function handlePointerDown(event) {
    const handle = event.target.closest(".column-resizer");
    if (!handle) return;
    event.preventDefault();
    const index = Number(handle.dataset.column);
    const startX = event.clientX;
    const startWidth = ui.timelineColumns[index];
    document.body.classList.add("resizing-column");
    const move = (moveEvent) => {
      ui.timelineColumns[index] = Math.max(70, Math.min(420, startWidth + moveEvent.clientX - startX));
      const col = mount.querySelectorAll(".timeline-table col")[index];
      const table = mount.querySelector(".timeline-table");
      if (col) col.style.width = `${ui.timelineColumns[index]}px`;
      if (table) table.style.width = `${ui.timelineColumns.reduce((sum, width) => sum + width, 0)}px`;
    };
    const stop = () => {
      document.body.classList.remove("resizing-column");
      root.removeEventListener("pointermove", move);
      root.removeEventListener("pointerup", stop);
    };
    root.addEventListener("pointermove", move);
    root.addEventListener("pointerup", stop, { once: true });
  }

  async function init() {
    db = await openDatabase();
    const saved = await dbGet(WORKSPACE_KEY);
    if (saved && C.validateWorkspace(saved).valid) workspace = migrateWorkspace(saved);
    ui.selectedEstimateId = workspace.estimates[0]?.id || "";
    ui.lastSaved = workspace.updatedAt || "";
    mount.addEventListener("click", handleClick);
    mount.addEventListener("change", handleChange);
    mount.addEventListener("pointerdown", handlePointerDown);
    render();
  }

  init();
})(globalThis);

  </script>
</body>
</html>
